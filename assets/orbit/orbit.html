<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ULTRON Orbital Matrix</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020306;
      font-family: 'Consolas', 'Segoe UI', monospace;
      color: #9fe7ff;
    }

    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #graph-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* HUD Layer */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: auto;
    }

    .brand-block {
      background: rgba(3, 8, 16, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.32);
      border-radius: 6px;
      padding: 10px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.75), 0 0 16px rgba(0, 240, 255, 0.15);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2.2px;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.7);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-subtitle {
      font-size: 9.5px;
      letter-spacing: 1.5px;
      color: #5b8cff;
      margin-top: 3px;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      transition: all 0.3s ease;
      margin-top: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff;
      animation: pulse-dot 1.8s infinite;
    }

    .status-badge.working {
      background: rgba(255, 179, 71, 0.18);
      border-color: rgba(255, 179, 71, 0.7);
      color: #ffb347;
    }
    .status-badge.working .status-dot {
      background: #ffb347;
      box-shadow: 0 0 14px #ffb347;
      animation: pulse-dot-fast 0.6s infinite;
    }

    .status-badge.speaking {
      background: rgba(0, 255, 157, 0.18);
      border-color: rgba(0, 255, 157, 0.7);
      color: #00ff9d;
    }
    .status-badge.speaking .status-dot {
      background: #00ff9d;
      box-shadow: 0 0 14px #00ff9d;
      animation: pulse-dot-fast 0.5s infinite;
    }

    .orbit-filters {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      pointer-events: auto;
    }

    .filter-btn {
      background: rgba(5, 14, 30, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.2);
      color: #6db6ff;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 0.8px;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(0, 240, 255, 0.22);
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.35);
    }

    .hud-controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(4, 11, 24, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.28);
      color: #8ad8ff;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1.2px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      text-transform: uppercase;
    }
    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.5);
    }
    .hud-btn:active {
      transform: scale(0.96);
    }
    .hud-btn.close-btn {
      border-color: rgba(255, 107, 107, 0.45);
      color: #ff9b9b;
    }
    .hud-btn.close-btn:hover {
      background: rgba(255, 107, 107, 0.25);
      border-color: #ff6b6b;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 107, 107, 0.6);
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: auto;
    }

    .instructions-card {
      background: rgba(3, 8, 16, 0.75);
      border: 1px solid rgba(0, 240, 255, 0.18);
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #6da2ff;
      backdrop-filter: blur(6px);
    }

    .activity-meter {
      background: rgba(3, 8, 16, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 4px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      letter-spacing: 1.2px;
      backdrop-filter: blur(8px);
    }

    .meter-bar-container {
      width: 130px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .meter-bar {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #00f0ff, #5b8cff);
      box-shadow: 0 0 8px #00f0ff;
      border-radius: 3px;
      transition: width 0.4s ease, background 0.4s ease;
    }

    .node-card {
      position: absolute;
      display: none;
      pointer-events: none;
      z-index: 100;
      background: rgba(5, 12, 26, 0.94);
      border: 1px solid #00f0ff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), 0 0 16px rgba(0, 240, 255, 0.4);
      border-radius: 6px;
      padding: 10px 14px;
      min-width: 220px;
      max-width: 320px;
      backdrop-filter: blur(10px);
      transform: translate(-50%, -120%);

    .node-card-title {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }

    .node-card-type {
      font-size: 9px;
      color: #00f0ff;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .node-card-desc {
      font-size: 10px;
      color: #a0c0e0;
      line-height: 1.4;
    }

      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes pulse-dot-fast {
      0%, 100% { opacity: 0.5; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>

    (function initStarfield() {
      const canvas = document.getElementById('space-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];
      const STAR_COUNT = 360;

      function resize(w, h) {
        canvas.width = w || window.innerWidth;
        canvas.height = h || window.innerHeight;
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5 + 0.4,
            alpha: Math.random() * 0.8 + 0.2,
            speed: Math.random() * 0.015 + 0.005,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      window.resizeSpaceCanvas = resize;
      window.addEventListener('resize', () => resize());
      resize();

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Deep space cosmic gradient
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.max(cx, cy));
        grad.addColorStop(0, '#060a18');
        grad.addColorStop(0.55, '#03060e');
        grad.addColorStop(1, '#020306');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const now = Date.now() * 0.001;
        for (let s of stars) {
          const a = s.alpha * (0.6 + 0.4 * Math.sin(now * s.speed * 20 + s.phase));
          ctx.fillStyle = `rgba(160, 225, 255, ${a})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

      { source: 'movie_dl', target: 'magnet_indexer', kind: 'plugin_link', value: 2.0, dist: 42 },
      { source: 'telegram_bridge', target: 'movie_dl', kind: 'remote_link', value: 2.2, dist: 75 },

      // ── Ultron Mail Orbit ──
      { source: 'ultron_mail', target: 'mail_inbox', kind: 'plugin_link', value: 2.2, dist: 42 },
      { source: 'ultron_mail', target: 'mail_drafts', kind: 'plugin_link', value: 2.0, dist: 40 },

      // ── Computer Control Orbit ──
      { source: 'comp_control', target: 'win_shell', kind: 'control_link', value: 2.2, dist: 45 },
      { source: 'comp_control', target: 'screen_pointer', kind: 'control_link', value: 2.2, dist: 44 },
      { source: 'comp_control', target: 'audio_matrix', kind: 'control_link', value: 2.0, dist: 42 },
      { source: 'vision_eyes', target: 'screen_pointer', kind: 'vision_link', value: 2.0, dist: 50 },

      // ── Memory Vault Orbit ──
      { source: 'memory_vault', target: 'user_profile', kind: 'memory_link', value: 2.2, dist: 42 },
      { source: 'memory_vault', target: 'projects_memory', kind: 'memory_link', value: 2.0, dist: 40 },

      // ── Google Workspace Orbit ──
      { source: 'google_workspace', target: 'google_drive', kind: 'workspace_link', value: 2.0, dist: 42 },
      { source: 'google_workspace', target: 'google_maps', kind: 'workspace_link', value: 2.0, dist: 42 },

      // ── Cross-Functional Links ──
      { source: 'voice_dsp', target: 'audio_matrix', kind: 'cross_link', value: 1.5, dist: 65 },
      { source: 'media_player', target: 'samsung_tv', kind: 'cross_link', value: 1.8, dist: 70 },

      // ── External Cloud & Service Connections Links ──
      { source: 'core', target: 'conn_mail', kind: 'conn_link', value: 2.2, dist: 95 },
      { source: 'ultron_mail', target: 'conn_mail', kind: 'conn_link', value: 2.5, dist: 45 },
      { source: 'google_workspace', target: 'conn_mail', kind: 'conn_link', value: 1.8, dist: 55 },

      { source: 'core', target: 'conn_gdrive', kind: 'conn_link', value: 2.2, dist: 95 },
      { source: 'google_workspace', target: 'conn_gdrive', kind: 'conn_link', value: 2.5, dist: 45 },
      { source: 'google_drive', target: 'conn_gdrive', kind: 'conn_link', value: 2.0, dist: 40 },

      { source: 'core', target: 'conn_youtube', kind: 'conn_link', value: 2.2, dist: 95 },
      { source: 'media_player', target: 'conn_youtube', kind: 'conn_link', value: 2.5, dist: 45 },

      { source: 'core', target: 'conn_smartthings', kind: 'conn_link', value: 2.2, dist: 95 },
      { source: 'smartthings', target: 'conn_smartthings', kind: 'conn_link', value: 2.5, dist: 45 },
      { source: 'samsung_tv', target: 'conn_smartthings', kind: 'conn_link', value: 2.0, dist: 45 },

      { source: 'core', target: 'conn_telegram', kind: 'conn_link', value: 2.2, dist: 95 },
      { source: 'telegram_bridge', target: 'conn_telegram', kind: 'conn_link', value: 2.5, dist: 45 },

      { source: 'core', target: 'conn_gmaps', kind: 'conn_link', value: 2.0, dist: 95 },
      { source: 'google_workspace', target: 'conn_gmaps', kind: 'conn_link', value: 2.2, dist: 45 },
      { source: 'google_maps', target: 'conn_gmaps', kind: 'conn_link', value: 1.8, dist: 40 },

      { source: 'core', target: 'conn_torrent', kind: 'conn_link', value: 2.0, dist: 95 },
      { source: 'movie_dl', target: 'conn_torrent', kind: 'conn_link', value: 2.2, dist: 45 },
      { source: 'qbittorrent', target: 'conn_torrent', kind: 'conn_link', value: 1.8, dist: 40 }
    ];

    // ── Graph Initialization ─────────────────────────────────────────────────
    const elem = document.getElementById('graph-container');
    let isWorking = false;
    let currentPulseSpeed = 0.004;
    let particleWidth = 2.2;
    let activeFilter = 'all';

    let connectionMap = {
      conn_mail: true,
      conn_gdrive: true,
      conn_youtube: true,
      conn_smartthings: true,
      conn_telegram: true,
      conn_gmaps: true,
      conn_torrent: true
    };

    const Graph = ForceGraph3D()(elem)
      .backgroundColor('rgba(0,0,0,0)')
      .showNavInfo(false)
      .enableNavigationControls(true)
      .enableNodeDrag(true)
      .nodeId('id')
      .nodeVal(n => n.val)
      .nodeColor(n => n.color)
      .nodeResolution(22)
      .nodeOpacity(0.94)
      .nodeRelSize(3.6)
      .linkColor(l => {
        if (l.kind === 'core_link') return 'rgba(0, 240, 255, 0.42)';
        if (l.kind === 'neural') return 'rgba(127, 231, 255, 0.45)';
        if (l.kind === 'device_link') return 'rgba(255, 179, 71, 0.55)';
        if (l.kind === 'plugin_link') return 'rgba(181, 140, 255, 0.45)';
        if (l.kind === 'control_link') return 'rgba(255, 107, 107, 0.45)';
        if (l.kind === 'conn_link') return 'rgba(0, 255, 157, 0.48)';
        return 'rgba(100, 160, 255, 0.3)';
      })
      .linkWidth(l => {
        if (l.kind === 'core_link') return 1.8;
        if (l.kind === 'neural') return 1.6;
        if (l.kind === 'conn_link') return 1.6;
        if (l.kind === 'device_link') return 1.4;
        return 0.9;
      })
      // Dynamic directional particles (the "male kuglice" moving between connected lines)
      .linkDirectionalParticles(l => {
        if (isWorking) {
          if (l.kind === 'core_link' || l.kind === 'neural' || l.kind === 'device_link' || l.kind === 'conn_link') return 6;
          return 4;
        }
        return (l.kind === 'core_link' || l.kind === 'neural' || l.kind === 'conn_link') ? 2 : 1;
      })
      .linkDirectionalParticleSpeed(l => currentPulseSpeed)
      .linkDirectionalParticleWidth(l => particleWidth)
      .linkDirectionalParticleColor(l => {
        if (isWorking) {
          if (l.kind === 'conn_link') return '#00ffc8';
          if (l.kind === 'device_link') return '#ffb703';
          if (l.kind === 'neural') return '#7fe7ff';
          if (l.kind === 'control_link') return '#ff6b6b';
          return '#00f0ff';
        }
        if (l.kind === 'conn_link') return '#00ff9d';
        return l.kind === 'device_link' ? '#ff9f1c' : '#7fe7ff';
      })
      .linkCurvature(l => l.kind === 'cross_link' ? 0.28 : (l.kind === 'device_link' ? 0.12 : (l.kind === 'conn_link' ? 0.08 : 0)))
      .graphData({ nodes: NODES, links: LINKS });

    // Set custom spring forces for natural hierarchical spacing
    try {
      Graph.d3Force('link').distance(l => (l.dist ? l.dist * 1.35 : 75));
      Graph.d3Force('charge').strength(-240);
      Graph.d3Force('center').strength(0.06);
    } catch(e) {}

    // Node tooltip interaction
    const nodeCard = document.getElementById('node-card');
    const cardTitle = document.getElementById('card-title');
    const cardType = document.getElementById('card-type');
    const cardDesc = document.getElementById('card-desc');

    Graph.onNodeHover(node => {
      if (node) {
        elem.style.cursor = 'pointer';
        cardTitle.textContent = (node.id === 'core' ? assistantName.toUpperCase() + ' ' : '') + node.name;
        if (node.kind === 'connection') {
          const isConn = connectionMap[node.id] !== false;
          cardType.innerHTML = `<span style="color:${isConn ? '#00ff9d' : '#ffb347'}">● ${isConn ? 'ONLINE // CONNECTED' : 'OFFLINE // STANDBY'}</span> · EXTERNAL CLOUD LINK`;
        } else {
          cardType.textContent = `${node.kind.toUpperCase()} // CLUSTER: ${node.cluster.toUpperCase()}`;
          cardType.style.color = node.color;
        }
        cardDesc.textContent = node.desc;
        nodeCard.style.display = 'block';
      } else {
        elem.style.cursor = null;
        nodeCard.style.display = 'none';
      }
    });

    document.addEventListener('mousemove', e => {
      if (nodeCard.style.display === 'block') {
        nodeCard.style.left = e.clientX + 'px';
        nodeCard.style.top = e.clientY + 'px';
      }
    });

    Graph.onNodeClick(node => {
      flyToNode(node);
      triggerPulse(2600);
    });

    function flyToNode(node) {
      if (!node) return;
      const distance = 95;
      const distRatio = 1 + distance / Math.max(1, Math.hypot(node.x, node.y, node.z));
      Graph.cameraPosition(
        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
        node,
        1300
      );
    }

    // ── 3D Auto-Orbit Camera Motion ──────────────────────────────────────────
    let angle = 0;
    let cameraDistance = 440;
    let userInteracting = false;
    let autoOrbitActive = true;

    elem.addEventListener('mousedown', () => { userInteracting = true; });
    window.addEventListener('mouseup', () => {
      setTimeout(() => { userInteracting = false; }, 2200);
    });

    setInterval(() => {
      if (autoOrbitActive && !userInteracting) {
        angle += isWorking ? 0.0035 : 0.0014;
        const x = cameraDistance * Math.sin(angle);
        const z = cameraDistance * Math.cos(angle);
        const y = 65 * Math.sin(angle * 0.45);
        Graph.cameraPosition({ x, y, z }, { x: 0, y: 0, z: 0 });
      }
    }, 28);

    // Initial camera zoom-in
    setTimeout(() => {
      Graph.cameraPosition({ x: 0, y: 50, z: cameraDistance }, { x: 0, y: 0, z: 0 }, 1100);
    }, 200);

    // ── Overlay Canvas (Orbital Rings, Labels & Glowing Energy Waves) ────────
    const overlayCanvas = document.getElementById('overlay-canvas');
    const octx = overlayCanvas.getContext('2d');
    let chargingRings = [];

    function resizeOverlay(w, h) {
      overlayCanvas.width = w || elem.clientWidth || window.innerWidth;
      overlayCanvas.height = h || elem.clientHeight || window.innerHeight;
    }
    window.resizeOverlayCanvas = resizeOverlay;
    window.addEventListener('resize', () => resizeOverlay());
    resizeOverlay();

    // ── Dynamic Dimension & WebGL Canvas Resizing ─────────────────────────────
    function updateDimensions() {
      const w = elem.clientWidth || window.innerWidth;
      const h = elem.clientHeight || window.innerHeight;
      if (w > 20 && h > 20) {
        if (typeof Graph !== 'undefined' && Graph.width && Graph.height) {
          Graph.width(w).height(h);
          if (Graph.renderer) {
            try {
              Graph.renderer().setSize(w, h);
              Graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
              if (Graph.camera()) {
                Graph.camera().aspect = w / h;
                Graph.camera().updateProjectionMatrix();
              }
            } catch(e) {}
          }
        }
        if (window.resizeSpaceCanvas) window.resizeSpaceCanvas(w, h);
        if (window.resizeOverlayCanvas) window.resizeOverlayCanvas(w, h);
      }
    }

    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => {
        updateDimensions();
      });
      ro.observe(elem);
      ro.observe(document.body);
    }
    window.addEventListener('resize', updateDimensions);

    // Initial polling check to catch initial paint
    let initDimTimer = setInterval(() => {
      if (elem.clientWidth > 20 && elem.clientHeight > 20) {
        updateDimensions();
        clearInterval(initDimTimer);
      }
    }, 120);
    setTimeout(() => { clearInterval(initDimTimer); }, 4000);

    window.refreshDimensions = function() {
      updateDimensions();
    };

    // Pulse wave generator when charging/working
    setInterval(() => {
      if (isWorking && NODES.length > 0) {
        // Emit expanding energy pulse from Core, Brain, and random active device
        const activeSources = [
          NODES[0], // Core
          NODES[1], // Brain
          NODES.find(n => n.id === 'smartthings'),
          NODES.find(n => n.id === 'samsung_tv'),
          NODES[Math.floor(Math.random() * NODES.length)]
        ].filter(Boolean);

        for (let sn of activeSources) {
          if (sn && sn.x !== undefined) {
            chargingRings.push({
              node: sn,
              r: 8,
              maxR: 36 + Math.random() * 24,
              alpha: 0.88,
              color: sn.color
            });
          }
        }
      }
    }, 240);

    function renderOverlay() {
      octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      const graphNodes = Graph.graphData().nodes;

      // 1. Draw glowing orbital guide rings around Hub centers
      const hubIds = ['core', 'smartthings', 'brain', 'movie_dl', 'comp_control', 'ultron_mail'];
      for (let hid of hubIds) {
        const hubNode = graphNodes.find(n => n.id === hid);
        if (hubNode && hubNode.x !== undefined && typeof Graph.graph2ScreenCoords === 'function') {
          const pt = Graph.graph2ScreenCoords(hubNode.x, hubNode.y, hubNode.z);
          if (pt && pt.x >= -100 && pt.x <= overlayCanvas.width + 100 && pt.y >= -100 && pt.y <= overlayCanvas.height + 100) {
            octx.save();
            octx.beginPath();
            const ringRadius = hid === 'core' ? 90 : (hid === 'smartthings' ? 45 : 38);
            octx.arc(pt.x, pt.y, ringRadius, 0, Math.PI * 2);
            octx.strokeStyle = hubNode.color;
            octx.globalAlpha = 0.08;
            octx.lineWidth = 1;
            octx.setLineDash([4, 6]);
            octx.stroke();
            octx.restore();
          }
        }
      }

      // 2. Draw charging energy pulse rings around nodes
      for (let i = chargingRings.length - 1; i >= 0; i--) {
        const ring = chargingRings[i];
        if (ring.node.x !== undefined && typeof Graph.graph2ScreenCoords === 'function') {
          const pt = Graph.graph2ScreenCoords(ring.node.x, ring.node.y, ring.node.z);
          if (pt && pt.x >= 0 && pt.x <= overlayCanvas.width && pt.y >= 0 && pt.y <= overlayCanvas.height) {
            octx.save();
            octx.beginPath();
            octx.arc(pt.x, pt.y, ring.r, 0, Math.PI * 2);
            octx.strokeStyle = ring.color;
            octx.globalAlpha = ring.alpha;
            octx.lineWidth = 1.6;
            octx.shadowColor = ring.color;
            octx.shadowBlur = 10;
            octx.stroke();
            octx.restore();
          }
        }
        ring.r += 1.3;
        ring.alpha -= 0.024;
        if (ring.alpha <= 0 || ring.r >= ring.maxR) {
          chargingRings.splice(i, 1);
        }
      }

      // 3. Draw sleek futuristic 2D labels floating above nodes
      if (typeof Graph.graph2ScreenCoords === 'function') {
        octx.font = '600 10.5px Consolas, monospace';
        octx.textAlign = 'center';
        octx.textBaseline = 'bottom';

        for (let node of graphNodes) {
          if (node.x === undefined) continue;
          
          // Filter visibility if activeFilter is set
          if (activeFilter !== 'all') {
            if (activeFilter === 'connections' && node.cluster !== 'connections' && node.id !== 'core') continue;
            if (activeFilter === 'smartthings' && node.cluster !== 'smartthings' && node.id !== 'core' && node.id !== 'brain') continue;
            if (activeFilter === 'brain' && node.cluster !== 'brain' && node.id !== 'core') continue;
            if (activeFilter === 'plugins' && node.kind !== 'plugin' && node.id !== 'core' && node.id !== 'brain') continue;
            if (activeFilter === 'control' && node.cluster !== 'control' && node.id !== 'core' && node.id !== 'brain') continue;
            if (activeFilter === 'movie_dl' && node.cluster !== 'movie_dl' && node.id !== 'core') continue;
          }

          const pos = Graph.graph2ScreenCoords(node.x, node.y, node.z);
          if (pos && pos.x >= -60 && pos.x <= overlayCanvas.width + 60 && pos.y >= -60 && pos.y <= overlayCanvas.height + 60) {
            const label = node.id === 'core' ? `${assistantName.toUpperCase()} CORE` : node.name;
            const offsetY = node.val * 1.4 + 7;
            
            // If connection node, draw glowing connection status tag
            if (node.kind === 'connection') {
              const isConn = connectionMap[node.id] !== false;
              const statusStr = isConn ? '● CONNECTED' : '○ STANDBY';
              const badgeColor = isConn ? '#00ff9d' : '#ffb347';
              octx.save();
              octx.font = '700 8px Consolas, monospace';
              octx.fillStyle = badgeColor;
              octx.shadowColor = badgeColor;
              octx.shadowBlur = 6;
              octx.fillText(statusStr, pos.x, pos.y - offsetY - 12);
              octx.restore();
            }

            octx.save();
            octx.font = '600 10.5px Consolas, monospace';
            octx.shadowColor = node.color;
            octx.shadowBlur = 8;
            octx.fillStyle = node.id === 'core' ? '#ffffff' : (isWorking ? '#ffffff' : '#b2e2ff');
            octx.globalAlpha = (node.kind === 'device' || node.kind === 'connection') ? 0.95 : (isWorking ? 0.92 : 0.82);
            octx.fillText(label, pos.x, pos.y - offsetY);
            octx.restore();
          }
        }
      }

      requestAnimationFrame(renderOverlay);
    }
    requestAnimationFrame(renderOverlay);

    // ── Dynamic State Switching (Idle vs Working) ────────────────────────────
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const meterBar = document.getElementById('meter-bar');
    const fluxVal = document.getElementById('flux-val');

    function updateStateUI(state) {
      state = (state || 'IDLE').toUpperCase();
      statusBadge.className = 'status-badge';

      if (['THINKING', 'PROCESSING', 'WORKING', 'TOOL', 'SEARCHING'].includes(state)) {
        isWorking = true;
        currentPulseSpeed = 0.015;
        particleWidth = 3.6;
        statusBadge.classList.add('working');
        statusText.textContent = `ACTIVE // ${state}`;
        meterBar.style.width = '95%';
        meterBar.style.background = 'linear-gradient(90deg, #ffb347, #ff6b6b)';
        meterBar.style.boxShadow = '0 0 14px #ffb347';
        fluxVal.textContent = 'HIGH (CHARGING)';
      } else if (state === 'SPEAKING') {
        isWorking = true;
        currentPulseSpeed = 0.016;
        particleWidth = 3.8;
        statusBadge.classList.add('speaking');
        statusText.textContent = 'TRANSMITTING // SPEECH';
        meterBar.style.width = '100%';
        meterBar.style.background = 'linear-gradient(90deg, #00ff9d, #00f0ff)';
        meterBar.style.boxShadow = '0 0 14px #00ff9d';
        fluxVal.textContent = 'MAX (STREAMING)';
      } else if (state === 'LISTENING') {
        isWorking = false;
        currentPulseSpeed = 0.006;
        particleWidth = 2.4;
        statusText.textContent = 'LISTENING // AUDIO RECEPTIVE';
        meterBar.style.width = '45%';
        meterBar.style.background = 'linear-gradient(90deg, #00f0ff, #5b8cff)';
        meterBar.style.boxShadow = '0 0 8px #00f0ff';
        fluxVal.textContent = 'NOMINAL';
      } else {
        isWorking = false;
        currentPulseSpeed = 0.0035;
        particleWidth = 2.2;
        statusText.textContent = 'MONITORING // STANDBY';
        meterBar.style.width = '20%';
        meterBar.style.background = 'linear-gradient(90deg, #00f0ff, #5b8cff)';
        meterBar.style.boxShadow = '0 0 6px #00f0ff';
        fluxVal.textContent = 'IDLE';
      }

      // Re-trigger particle flows in graph
      Graph.linkDirectionalParticles(Graph.linkDirectionalParticles())
           .linkDirectionalParticleSpeed(currentPulseSpeed)
           .linkDirectionalParticleWidth(particleWidth);
    }

    let pulseTimer = null;
    function triggerPulse(durationMs = 3800) {
      const prevWorking = isWorking;
      isWorking = true;
      currentPulseSpeed = 0.016;
      particleWidth = 3.8;
      meterBar.style.width = '94%';
      fluxVal.textContent = 'CHARGING SURGE';
      Graph.linkDirectionalParticles(Graph.linkDirectionalParticles())
           .linkDirectionalParticleSpeed(currentPulseSpeed)
           .linkDirectionalParticleWidth(particleWidth);

      if (pulseTimer) clearTimeout(pulseTimer);
      pulseTimer = setTimeout(() => {
        if (!prevWorking) {
          updateStateUI('IDLE');
        }
      }, durationMs);
    }

    // ── External Window API (called by Python / Ultron) ──────────────────────
    window.setOrbitState = function(state) {
      updateStateUI(state);
    };

    window.triggerEnergyPulse = function() {
      triggerPulse(4000);
    };

    window.setAssistantName = function(name) {
      if (!name) return;
      assistantName = name;
      document.getElementById('orbit-title').innerHTML = `<span>◈</span> ${name.toUpperCase()} ORBIT`;
    };

    window.setConnections = function(connStatusMap) {
      if (connStatusMap && typeof connStatusMap === 'object') {
        Object.assign(connectionMap, connStatusMap);
      }
    };

    window.focusSubsystem = function(subsystemId) {
      if (subsystemId === 'connections') {
        const connNode = NODES.find(n => n.id === 'conn_mail') || NODES.find(n => n.kind === 'connection');
        if (connNode) flyToNode(connNode);
        triggerPulse(3500);
        return;
      }
      const target = NODES.find(n => n.id === subsystemId || n.cluster === subsystemId);
      if (target) {
        flyToNode(target);
        triggerPulse(3500);
      }
    };

    window.resetCamera = function() {
      angle = 0;
      activeFilter = 'all';
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.target === 'all'));
      Graph.cameraPosition({ x: 0, y: 45, z: cameraDistance }, { x: 0, y: 0, z: 0 }, 1000);
    };

    // ── Filter Buttons ───────────────────────────────────────────────────────
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.target;
        
        if (activeFilter === 'all') {
          window.resetCamera();
        } else {
          window.focusSubsystem(activeFilter);
        }
      });
    });

    // ── Header Buttons ───────────────────────────────────────────────────────
    document.getElementById('btn-pulse').addEventListener('click', () => {
      triggerPulse(4000);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      window.resetCamera();
    });

    let isExpanded = false;
    const btnExpand = document.getElementById('btn-expand');
    if (btnExpand) {
      btnExpand.addEventListener('click', () => {
        isExpanded = !isExpanded;
        btnExpand.textContent = isExpanded ? '❐ RESTORE' : '⛶ EXPAND';
        document.title = 'JARVIS_ORBIT_TOGGLE_EXPAND';
        setTimeout(() => {
          document.title = 'JARVIS Orbital Matrix';
          if (window.refreshDimensions) window.refreshDimensions();
        }, 150);
      });
    }

    document.getElementById('btn-close').addEventListener('click', () => {
      document.title = 'JARVIS_ORBIT_CLOSE';
    });
  </script>
</body>
</html>
