<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Only ULTRON's own files run here. Images and map tiles may come from
       https; nothing else may be fetched except the local dev transport. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>ULTRON 2.0 · Made by Pedja</title>
  <meta name="author" content="Pedja">
  <meta name="description" content="ULTRON 2.0 — Made by Pedja (https://github.com/Medjed42/ultron)">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#input">Skip to message box</a>
  <div id="app" class="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/core.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
